<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brawlchara</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/32×32.png" type="image/png" sizes="32×32" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    #disclaimer { color:#6b0000; font-weight:600; font-size:.8rem; background:#fff5f5; padding:5px 10px; border:1px solid #d48b8b; border-radius:4px; max-width:420px; }
    #tokenList code { display:inline-block; max-width:300px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
    button.loading { opacity:.6; cursor:not-allowed; }
    .character-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
    #characterResult { max-width:760px; }
    .character-card { border:1px solid #ddd; border-radius:16px; padding:18px; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.08); }
    .character-head { display:flex; gap:18px; align-items:center; }
    .character-icon { width:128px; height:128px; object-fit:contain; }
    .character-meta h3 { margin:0 0 6px; font-size:1.8rem; }
    .character-meta p { margin:4px 0; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; margin:16px 0; }
    .stat { border:1px solid #e4e4e4; border-radius:10px; padding:10px; }
    .stat strong { display:block; font-size:.8rem; opacity:.7; }
    .ability-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
    .ability { display:flex; gap:10px; border:1px solid #e4e4e4; border-radius:10px; padding:10px; align-items:flex-start; }
    .ability img { width:54px; height:54px; object-fit:contain; flex:none; }
    .ability h4 { margin:0 0 4px; }
    .ability p { margin:0; font-size:.9rem; line-height:1.35; }
    .muted { opacity:.65; }
    .error { color:#b00020; white-space:pre-wrap; }
    #cookieConsent { position:fixed; bottom:0; left:0; width:100%; box-sizing:border-box; background:#333; color:#fff; padding:20px; text-align:center; box-shadow:0 -4px 12px rgba(0,0,0,.3); z-index:1000; display:none; }
    #cookieConsent .button-container { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    #cookieConsent button { background:#4CAF50; color:#fff; border:0; padding:10px 20px; border-radius:8px; cursor:pointer; }
    #cookieConsent button.no { background:#f44336; }
    @media (max-width:560px) { .character-head { align-items:flex-start; } .character-icon { width:96px; height:96px; } }
  </style>
</head>
<body>
  <p id="disclaimer">※このツールはBrawl Stars公式のものではありません。非公式のファンメイドツールです。</p>
  <h1><i class="fa-solid fa-user-ghost"></i> Brawlchara</h1>

  <label for="expires">トークン有効期限:</label>
  <select id="expires">
    <option value="3600">1時間</option>
    <option value="86400">24時間</option>
    <option value="604800">7日間</option>
    <option value="0">無制限</option>
  </select>
  <button id="generateToken"><i class="fa-solid fa-key"></i> トークン生成</button>
  <button id="copyToken" disabled><i class="fa-regular fa-copy"></i> トークンをコピー</button>
  <p>生成されたトークン:</p>
  <textarea id="tokenOutput" rows="4" cols="60" readonly></textarea>
  <p id="tokenStatus" role="status" aria-live="polite"></p>

  <h2>生成済みトークン一覧</h2>
  <ul id="tokenList"><li>トークンがありません</li></ul>

  <h2>キャラを取得</h2>
  <div class="character-controls">
    <label for="powerLevel">パワーレベル:</label>
    <select id="powerLevel"></select>
    <label for="drawCount">取得数:</label>
    <select id="drawCount"><option value="1">1体</option><option value="3">3体</option><option value="5">5体</option></select>
    <button id="getCharacter"><i class="fa-solid fa-dice-d20"></i> 試す</button>
  </div>
  <div id="characterResult" aria-live="polite"></div>

  <section class="catalog-panel" aria-labelledby="catalogTitle">
    <h2 id="catalogTitle">キャラ図鑑</h2>
    <p class="muted">日本語・英語・IDで検索。ひらがなでも探せます。絞り込みはランダム取得にも使えます。</p>
    <div class="catalog-toolbar">
      <label for="catalogSearch">キャラ名・ID<input id="catalogSearch" type="search" maxlength="100" placeholder="例: シェリー / shelly / 16000000" /></label>
      <label for="catalogRarity">レア度<select id="catalogRarity"><option value="">すべて</option></select></label>
      <label for="catalogRole">タイプ<select id="catalogRole"><option value="">すべて</option></select></label>
      <label for="catalogSort">並び順<select id="catalogSort"><option value="id">ID順</option><option value="-id">ID逆順</option><option value="name">名前順</option><option value="-health">HPが高い順</option><option value="-attackDamage">1ヒットの攻撃力が高い順</option></select></label>
    </div>
    <div class="catalog-actions">
      <button id="catalogLoad" type="button">図鑑を開く・更新</button>
      <label class="check-label"><input id="favoritesOnly" type="checkbox" /> お気に入りのみ <span id="favoriteCount">0</span>体</label>
      <button id="catalogReset" type="button">条件をクリア</button>
    </div>
    <p id="catalogStatus" role="status" aria-live="polite">トークンを生成または選択して、図鑑を開いてください。</p>
    <div id="catalogGrid" class="catalog-grid" aria-busy="false"></div>
    <nav class="catalog-pagination" aria-label="図鑑のページ">
      <button id="catalogPrev" type="button" disabled>前へ</button>
      <span id="catalogPage">0 / 0</span>
      <button id="catalogNext" type="button" disabled>次へ</button>
    </nav>
  </section>

  <h2><i class="fa-solid fa-book"></i> ドキュメント</h2>
  <p><a href="https://document-api-brawl-chara.vercel.app/" target="_blank" rel="noopener noreferrer">マニュアルを見る</a></p>
  <p><a href="https://a-b-c.vercel.app/" target="_blank" rel="noopener noreferrer">お問い合わせ</a></p>

  <div id="cookieConsent">
    当サイトはクッキーを使用します。同意しますか？
    <div class="button-container">
      <button id="acceptCookie">同意する</button>
      <button id="declineCookie" class="no">拒否する</button>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById('generateToken');
    const getCharBtn = document.getElementById('getCharacter');
    const copyBtn = document.getElementById('copyToken');
    const tokenOutput = document.getElementById('tokenOutput');
    const tokenStatus = document.getElementById('tokenStatus');
    const characterResult = document.getElementById('characterResult');
    const tokenList = document.getElementById('tokenList');
    const powerLevel = document.getElementById('powerLevel');
    const STORAGE_KEY = 'brawlstar_tokens';
    const COOKIE_CONSENT_KEY = 'cookieConsent';

    for (let level = 11; level >= 1; level -= 1) {
      const option = document.createElement('option');
      option.value = String(level);
      option.textContent = `パワー ${level}`;
      powerLevel.appendChild(option);
    }

    function setLoading(button, loading) {
      button.classList.toggle('loading', loading);
      button.disabled = loading;
      if (button === generateBtn) button.innerHTML = loading ? '処理中...' : '<i class="fa-solid fa-key"></i> トークン生成';
      if (button === getCharBtn) button.innerHTML = loading ? '取得中...' : '<i class="fa-solid fa-dice-d20"></i> 試す';
    }

    function loadTokens() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        const now = Date.now();
        const tokens = (Array.isArray(stored) ? stored : []).filter((item) =>
          item && typeof item.token === 'string' && item.token.trim() &&
          Number.isFinite(item.expiresAt) && (item.expiresAt === 0 || item.expiresAt > now)
        );
        return tokens;
      } catch { return []; }
    }

    function saveTokens(tokens) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tokens)); }
      catch { tokenStatus.textContent = 'ブラウザーに保存できませんでした。必要なトークンをコピーして保管してください。'; }
    }
    function shortenToken(token) { return token.length <= 20 ? token : `${token.slice(0, 10)}...${token.slice(-6)}`; }

    function renderTokenList() {
      const tokens = loadTokens();
      tokenList.replaceChildren();
      if (!tokens.length) {
        const li = document.createElement('li'); li.textContent = 'トークンがありません'; tokenList.appendChild(li); return;
      }
      tokens.forEach(({ token, expiresAt }) => {
        const li = document.createElement('li');
        const use = document.createElement('button'); use.textContent = '▶'; use.title = 'このトークンを使う';
        const code = document.createElement('code'); code.textContent = shortenToken(token);
        const small = document.createElement('small'); small.textContent = ` 有効期限: ${expiresAt === 0 ? '無制限' : new Date(expiresAt).toLocaleString()}`;
        const remove = document.createElement('button'); remove.textContent = '✕'; remove.title = '削除'; remove.style.color = 'red';
        use.onclick = () => {
          tokenOutput.value = loadTokens().find((item) => item.token === token)?.token || '';
          copyBtn.disabled = !tokenOutput.value;
          tokenStatus.textContent = tokenOutput.value ? 'トークンを選択しました。' : 'このトークンは期限切れです。';
          renderTokenList();
        };
        remove.onclick = () => {
          saveTokens(loadTokens().filter((item) => item.token !== token));
          if (tokenOutput.value === token) { tokenOutput.value = ''; copyBtn.disabled = true; }
          renderTokenList();
        };
        li.append(use, code, small, remove); tokenList.appendChild(li);
      });
    }

    async function generateToken() {
      setLoading(generateBtn, true);
      tokenStatus.textContent = '';
      try {
        const seconds = Number(document.getElementById('expires').value);
        const response = await fetch('/api/token', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expiresIn: seconds === 0 ? 'never' : seconds }),
        });
        const data = await response.json();
        if (!response.ok || !data.token) throw new Error(data.error || `HTTP ${response.status}`);
        const expiresAt = data.expiresAt;
        if (!Number.isFinite(expiresAt) || expiresAt < 0) throw new Error('有効期限を取得できませんでした。');
        tokenOutput.value = data.token; copyBtn.disabled = false;
        const tokens = loadTokens();
        if (!tokens.some((item) => item.token === data.token)) tokens.push({ token: data.token, expiresAt });
        saveTokens(tokens); renderTokenList();
      } catch (error) { tokenStatus.textContent = `エラー: ${error.message}`; }
      finally { copyBtn.disabled = !tokenOutput.value; setLoading(generateBtn, false); }
    }

    function stat(label, value, suffix = '') {
      const box = document.createElement('div'); box.className = 'stat';
      const title = document.createElement('strong'); title.textContent = label;
      const body = document.createElement('span'); body.textContent = value == null ? 'データなし' : `${value}${suffix}`;
      box.append(title, body); return box;
    }

    function renderAbilities(title, items) {
      const section = document.createElement('section');
      const heading = document.createElement('h3'); heading.textContent = title; section.appendChild(heading);
      if (!items?.length) {
        const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = 'データなし'; section.appendChild(empty); return section;
      }
      const grid = document.createElement('div'); grid.className = 'ability-grid';
      items.forEach((item) => {
        const card = document.createElement('div'); card.className = 'ability';
        if (item.image) { const img = document.createElement('img'); img.src = item.image; img.alt = item.name || ''; img.loading = 'lazy'; card.appendChild(img); }
        const text = document.createElement('div');
        const name = document.createElement('h4'); name.textContent = item.name || '名称不明';
        const desc = document.createElement('p'); desc.textContent = item.description || '説明なし';
        text.append(name, desc); card.appendChild(text); grid.appendChild(card);
      });
      section.appendChild(grid); return section;
    }

    function renderCharacter(data, append = false) {
      if (!append) characterResult.replaceChildren();
      const card = document.createElement('article'); card.className = 'character-card';
      const head = document.createElement('div'); head.className = 'character-head';
      const img = document.createElement('img'); img.className = 'character-icon'; img.src = data.image || ''; img.alt = `${data.name}のアイコン`;
      const meta = document.createElement('div'); meta.className = 'character-meta';
      const name = document.createElement('h3'); name.textContent = data.name;
      const rarity = document.createElement('p'); rarity.textContent = `レア度: ${data.rarity}`;
      const role = document.createElement('p'); role.textContent = `タイプ: ${data.role}`;
      const id = document.createElement('p'); id.className = 'muted'; id.textContent = `ID: ${data.id}`;
      meta.append(name, rarity, role, id); head.append(img, meta); card.appendChild(head);

      if (data.stats) {
        const h = document.createElement('h3'); h.textContent = `ステータス（パワー ${data.stats.level}）`; card.appendChild(h);
        const grid = document.createElement('div'); grid.className = 'stats-grid';
        grid.append(
          stat('HP', data.stats.health), stat('攻撃ダメージ / 1ヒット', data.stats.attackDamage),
          stat('1攻撃の弾数', data.stats.projectilesPerAttack), stat('リロード', data.stats.reloadMs, ' ms'),
          stat('射程', data.stats.range, ' マス'), stat('移動速度', data.stats.moveSpeed), stat('弾数', data.stats.ammo)
        );
        card.appendChild(grid);
      } else {
        const unavailable = document.createElement('p'); unavailable.className = 'muted'; unavailable.textContent = 'ステータスデータを取得できませんでした。'; card.appendChild(unavailable);
      }

      card.append(renderAbilities('ガジェット', data.gadgets), renderAbilities('スターパワー', data.starPowers));
      characterResult.appendChild(card);
    }

    async function getCharacter() {
      const token = tokenOutput.value.trim();
      if (!token) { alert('トークンを選択または生成してください'); return; }
      setLoading(getCharBtn, true); characterResult.replaceChildren();
      try {
        const params = new URLSearchParams({ level: powerLevel.value, count: document.getElementById('drawCount').value || '1' });
        if (document.getElementById('favoritesOnly').checked) {
          const ids = globalThis.getCatalogFavoriteIds?.() || [];
          if (!ids.length) throw new Error('先に図鑑でお気に入りを登録してください。');
          params.set('ids', ids.join(','));
        }
        for (const [key, element] of [['q', 'catalogSearch'], ['rarity', 'catalogRarity'], ['role', 'catalogRole']]) {
          const value = document.getElementById(element).value.trim();
          if (value) params.set(key, value);
        }
        const response = await fetch(`/api/character?${params}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        (Array.isArray(data) ? data : [data]).forEach((item, index) => renderCharacter(item, index > 0));
      } catch (error) {
        const message = document.createElement('p'); message.className = 'error'; message.textContent = `通信エラー: ${error.message}`; characterResult.appendChild(message);
      } finally { setLoading(getCharBtn, false); }
    }

    async function copyTokenToClipboard() {
      if (!tokenOutput.value) return;
      try {
        await navigator.clipboard.writeText(tokenOutput.value);
        tokenStatus.textContent = 'トークンをコピーしました。';
      } catch {
        tokenOutput.focus(); tokenOutput.select();
        tokenStatus.textContent = 'コピーできませんでした。選択されたトークンを手動でコピーしてください。';
      }
    }

    function showCookieConsentUi(show) { document.getElementById('cookieConsent').style.display = show ? 'block' : 'none'; }
    async function sendCookieConsentToDiscord() {
      try {
        await fetch('/api/cookie', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ consent:'accepted', timestamp:new Date().toISOString() }) });
      } catch (error) { console.error(error); }
    }

    function saveConsent(value) {
      try { localStorage.setItem(COOKIE_CONSENT_KEY, value); } catch { /* Storage may be disabled. */ }
      showCookieConsentUi(false);
    }
    document.getElementById('acceptCookie').onclick = () => { saveConsent('accepted'); sendCookieConsentToDiscord(); };
    document.getElementById('declineCookie').onclick = () => { saveConsent('declined'); };
    document.addEventListener('DOMContentLoaded', () => {
      let consent;
      try { consent = localStorage.getItem(COOKIE_CONSENT_KEY); } catch { /* Storage may be disabled. */ }
      showCookieConsentUi(!['accepted', 'declined'].includes(consent)); renderTokenList();
    });
    generateBtn.addEventListener('click', generateToken);
    getCharBtn.addEventListener('click', getCharacter);
    copyBtn.addEventListener('click', copyTokenToClipboard);
  </script>
  <script src="/catalog.js" defer></script>
</body>
</html>
